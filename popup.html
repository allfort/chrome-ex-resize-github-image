<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body {
      width: 300px;
      padding: 10px;
    }
    .container {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .size-control {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .size-value {
      min-width: 40px;
      text-align: right;
    }
    input[type="range"] {
      flex: 1;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="size-control">
      <label for="imageSize">画像サイズ:</label>
      <input type="range" id="imageSize" min="100" max="800" value="400" step="50">
      <span id="sizeValue" class="size-value">400px</span>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
