<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body {
      width: 300px;
      padding: 10px;
    }
    .container {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .size-control {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .size-value {
      min-width: 40px;
      text-align: right;
    }
    button {
      width: 100%;
      padding: 8px;
      background-color: #4CAF50;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    button:hover {
      background-color: #45a049;
    }
    input[type="range"] {
      flex: 1;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="size-control">
      <label for="imageSize">画像サイズ:</label>
      <input type="range" id="imageSize" min="100" max="800" value="400" step="10">
      <span id="sizeValue" class="size-value">400px</span>
    </div>
    <button id="convertButton">画像タグを変換</button>
  </div>
  <script src="popup.js"></script>
</body>
</html>
